# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\LogImporter\LogImporterService:
        class: App\Service\LogImporter\LogImporterService
        arguments:
            $batchSize: '%env(int:LOG_SAVING_BATCH_SIZE)%'

    App\Service\LogImporter\ParsingStrategy\ParserStrategyInterface:
        class: App\Service\LogImporter\ParsingStrategy\SubStringParserStrategy
#        class: App\Service\LogImporter\ParsingStrategy\RegexParserStrategy

    App\Service\LogImporter\Transformer\LogTransformer:
        arguments:
            $logger: '@console.logger'

    App\Service\LogImporter\Filter\LogFilterIterator:
        arguments:
            $logger: '@console.logger'

    console.logger:
        class: Symfony\Component\Console\Logger\ConsoleLogger
        arguments:
            $output: '@console.output'

    console.output:
        class: Symfony\Component\Console\Output\ConsoleOutput


    App\EventListener\ExceptionListener:
        tags: [ kernel.event_listener ]